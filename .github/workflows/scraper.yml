name: Subito MacBook Pro Hunter

on:
  schedule:
    # Esecuzione automatica ogni 15 minuti
    - cron: '*/15 * * * *'
  push:
    branches:
      - main
  workflow_dispatch: # Consente l'avvio manuale con un clic da GitHub

permissions:
  contents: write # Necessario per salvare seen_ads.json nel repository

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verifica Secret Telegram
        run: |
          if [ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]; then
            echo "❌ TELEGRAM_BOT_TOKEN non trovato nei Secrets di GitHub!"
            exit 1
          else
            echo "✅ TELEGRAM_BOT_TOKEN configurato correttamente."
          fi
          if [ -z "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            echo "❌ TELEGRAM_CHAT_ID non trovato nei Secrets di GitHub!"
            exit 1
          else
            echo "✅ TELEGRAM_CHAT_ID configurato correttamente."
          fi

      - name: Esegui Scraper Subito.it
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scraper.py --once

      - name: Salva storico annunci visti (seen_ads.json)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_ads.json
          git commit -m "Aggiornato visto annunci [skip ci]" || echo "Nessun nuovo annuncio da registrare"
          git push
